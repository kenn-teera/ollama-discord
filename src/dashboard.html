<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama Discord Bot</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2128; --muted:#667085; --line:#e2e5ea; --accent:#5865f2; --ok:#1a7f4b; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --text:#e6e8eb; --muted:#8b93a1; --line:#2a2f38; --accent:#7983f5; --ok:#4cc38a; --bad:#ff6b5b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:15px; margin:0 0 12px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat b { display:block; font-size:18px; } .stat span { color:var(--muted); font-size:13px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--bad); }
  .dot.on { background:var(--ok); }
  label { display:block; font-weight:600; margin:14px 0 4px; } label:first-of-type { margin-top:0; }
  .hint { color:var(--muted); font-size:13px; font-weight:400; }
  input[type=text], input[type=number], select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:140px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; } .row > div { flex:1 1 200px; }
  .switch { display:flex; align-items:center; gap:10px; margin-top:14px; font-weight:600; }
  .switch input { width:18px; height:18px; }
  button { padding:8px 14px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap; }
  #msg { font-size:14px; } #msg.err { color:var(--bad); } #msg.ok { color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:13px; } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; } .empty { color:var(--muted); padding:8px 0; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>Ollama Discord Bot</h1>
  <div class="sub" id="who">Loading…</div>

  <div class="card"><div class="stats" id="stats"></div></div>

  <form class="card" id="form">
    <h2>Settings <span class="hint">— applied immediately, saved to config.json</span></h2>

    <label for="model">Model <span class="hint">(installed in Ollama)</span></label>
    <select id="model"></select>

    <label for="systemPrompt">System prompt</label>
    <textarea id="systemPrompt" maxlength="4000"></textarea>
    <div class="actions" style="margin-top:6px"><button type="button" id="resetPrompt">Reset prompt to default</button></div>

    <div class="row">
      <div><label for="historyLimit">History length <span class="hint">(messages kept per channel)</span></label><input type="number" id="historyLimit" min="1" max="50"></div>
      <div><label for="numCtx">Context size <span class="hint">(tokens; more = slower, more RAM)</span></label><input type="number" id="numCtx" min="1024" max="32768" step="1024"></div>
    </div>

    <div class="switch"><input type="checkbox" id="searchEnabled"><label for="searchEnabled" style="margin:0">Web search enabled</label></div>
    <div class="switch"><input type="checkbox" id="paused"><label for="paused" style="margin:0">Pause bot <span class="hint">(it replies that it is paused)</span></label></div>

    <div class="actions">
      <button class="primary" type="submit" id="save">Save</button>
      <button type="button" id="clear">Clear all conversation history</button>
      <span id="msg"></span>
    </div>
  </form>

  <div class="card">
    <h2>Recent activity <span class="hint">— kept in memory only, last 50</span></h2>
    <div class="scroll" id="activity"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let dirty = false, defaultPrompt = '';

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function stat(label, value, dot) {
  const d = el('div', undefined, 'stat'), b = el('b');
  if (dot !== undefined) b.append(el('span', '', 'dot' + (dot ? ' on' : '')));
  b.append(document.createTextNode(value)); d.append(b, el('span', label)); return d;
}
function fmtUptime(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}h ${m}m` : `${m}m ${s % 60}s`; }
function flash(text, ok) { const m = $('msg'); m.textContent = text; m.className = ok ? 'ok' : 'err'; setTimeout(() => { m.textContent = ''; }, 4000); }

function render(s, fillForm) {
  defaultPrompt = s.defaultSystemPrompt;
  $('who').textContent = s.botTag ? `Logged in as ${s.botTag}` : 'Discord: not connected yet';
  const stats = $('stats'); stats.replaceChildren(
    stat('Discord', s.ready ? 'Online' : 'Offline', s.ready),
    stat('Ollama', s.ollamaOnline ? 'Online' : 'Unreachable', s.ollamaOnline),
    stat('Search tools', s.tools.length ? s.tools.join(', ') : 'none'),
    stat('Uptime', fmtUptime(s.uptimeSeconds)),
    stat('Replies / errors', `${s.replies} / ${s.errors}`),
  );
  if (fillForm) {
    const sel = $('model'); sel.replaceChildren();
    const names = s.models.includes(s.config.model) ? s.models : [s.config.model, ...s.models];
    for (const n of names) { const o = el('option', n); o.value = n; sel.append(o); }
    sel.value = s.config.model;
    $('systemPrompt').value = s.config.systemPrompt;
    $('historyLimit').value = s.config.historyLimit;
    $('numCtx').value = s.config.numCtx;
    $('searchEnabled').checked = s.config.searchEnabled;
    $('paused').checked = s.config.paused;
  }
  const box = $('activity');
  if (!s.activity.length) { box.replaceChildren(el('div', 'No messages yet.', 'empty')); return; }
  const t = el('table'), head = el('tr');
  for (const h of ['Time', 'User', 'Message', 'Search', 'Took', 'Result']) head.append(el('th', h));
  t.append(head);
  for (const a of s.activity) {
    const r = el('tr');
    r.append(el('td', new Date(a.time).toLocaleTimeString()), el('td', a.user), el('td', a.prompt), el('td', a.usedTools ? 'yes' : '—'), el('td', (a.ms / 1000).toFixed(1) + 's'), el('td', a.error ? 'error: ' + a.error : 'ok'));
    t.append(r);
  }
  box.replaceChildren(t);
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
async function refresh(fillForm) { try { render(await api('/api/state'), fillForm); } catch (e) { $('who').textContent = 'Dashboard error: ' + e.message; } }

$('form').addEventListener('input', () => { dirty = true; });
$('resetPrompt').onclick = () => { $('systemPrompt').value = defaultPrompt; dirty = true; };
$('form').addEventListener('submit', async (e) => {
  e.preventDefault(); $('save').disabled = true;
  try {
    await api('/api/config', {
      model: $('model').value, systemPrompt: $('systemPrompt').value,
      historyLimit: Number($('historyLimit').value), numCtx: Number($('numCtx').value),
      searchEnabled: $('searchEnabled').checked, paused: $('paused').checked,
    });
    dirty = false; flash('Saved', true); await refresh(true);
  } catch (err) { flash(err.message, false); }
  $('save').disabled = false;
});
$('clear').onclick = async () => {
  if (!confirm('Clear conversation history for every channel?')) return;
  try { await api('/api/clear-history', {}); flash('History cleared', true); } catch (err) { flash(err.message, false); }
};

refresh(true);
setInterval(() => refresh(!dirty && document.activeElement?.closest('form') === null), 5000);
</script>
</body>
</html>
