services:
  searxng:
    image: searxng/searxng:latest
    container_name: ollama-discord-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"   # local only
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?run ./setup.sh first}
